# cargo-audit config for the Nightcore Rust core. Read by `cargo audit` when it
# runs from apps/desktop/src-tauri (the Dependency Audit CI job does).
#
# Ignores are for advisories with NO upstream fix path we control — each entry
# must say where the crate comes from and when to remove it. Never ignore an
# advisory on a direct dependency we can bump ourselves.

[advisories]
# Empty: `cargo update` collapsed both locked quick-xml instances (0.39.4 via
# plist → tauri, 0.37.5 via tauri-winrt-notification → notify-rust →
# tauri-plugin-notification) into a single quick-xml 0.41.x, clearing
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195. See git history for the prior
# ignore entries.
ignore = []

# Informational advisories deliberately NOT ignored (reviewed 2026-10-01).
# `cargo audit` reports them as warnings and does not fail on them; they stay
# visible here instead of being silenced. Both are upstream-pinned by tauri 2
# with no release that drops them:
#   - unmaintained proc-macro-error (RUSTSEC-2024-0370) + unsound glib 0.18
#     VariantStrIter (RUSTSEC-2024-0429): gtk-rs 0.18 via muda/wry/tauri,
#     Linux (webkit2gtk) build only, absent from the macOS/Windows trees.
#     Nightcore never iterates a GVariant string array itself.
# The unmaintained unic-* warnings (RUSTSEC-2025-0075/0080/0081/0098/0100) left
# with tauri-utils 2.10 (urlpattern 0.6). RUSTSEC-2026-0285 (rustls), -0190
# (anyhow) and -0221 (event-listener) were fixed by earlier lockfile bumps.
