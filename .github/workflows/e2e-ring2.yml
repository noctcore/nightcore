# E2E ladder RING 2 (issue #406) — a real WebDriver driving the real desktop app.
#
# WHY ITS OWN WORKFLOW, AND WHY IT IS NOT A PER-PR REQUIRED CHECK
# ----------------------------------------------------------------
# Ring 3 rides `ci.yml`'s already-required bun job because it costs ~2 seconds. This
# one cannot: it has to BUILD the app (the whole Tauri dependency tree, plus the web
# bundle and the sidecar), which is ~20-25 min cold and ~5-8 min on a warm cargo cache.
# Making that a required per-PR check would add the longest pole in CI to every merge,
# and on day one its flake profile is unmeasured — a brand-new browser-driving job that
# blocks every merge is a bad trade.
#
# The other failure mode is worse though: a job nobody must pass rots. So this is NOT
# `continue-on-error` and it is NOT advisory. It runs:
#
#   * on every push to main    — a break lands as a RED RUN ON MAIN within the hour,
#                                which is a thing someone has to fix, not a badge
#                                nobody reads;
#   * nightly                  — catches rot from toolchain/runner-image drift on a
#                                repo that does not merge every day;
#   * on demand                — `workflow_dispatch`, for someone touching the shell;
#   * on a labelled PR         — add the `e2e: ring2` label and it runs pre-merge, so a
#                                risky change to the app shell, the Tauri config, or
#                                the web boot path can be gated deliberately.
#
# PROMOTION CRITERION (write it down or it never happens): once this job has 20
# consecutive green runs with no re-run, and the warm-cache wall clock is under 10
# minutes, move it to `pull_request` unconditionally and mark it required. Until then,
# post-merge + nightly is the honest trade.
#
# WHY LINUX ONLY: macOS's WKWebView exposes no CDP and no WebDriver endpoint — that
# constraint is why every other tier of this ladder is what it is. Linux's WebKitGTK
# ships WebKitWebDriver, which tauri-driver fronts, so this is the one platform where
# CI can drive the actual Tauri window. There is no Windows equivalent wired here.
name: e2e ring 2

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 03:30 UTC daily — off the peak-hours runner queue.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  ring2:
    name: tauri-driver golden path (Linux)
    # On a PR this only runs when the author asked for it with the label; on
    # push/schedule/dispatch it always runs. Expressed as a job-level `if` rather than
    # a separate workflow so there is ONE definition of the ring to keep working.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e: ring2')
    runs-on: ubuntu-latest
    # Sized for a COLD cargo cache building the whole Tauri tree (the same reasoning as
    # ci.yml's rust jobs), not the warm path. If a legitimate cold build ever trips
    # this, bump it once rather than removing it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Pinned to match apps/desktop/src-tauri/rust-toolchain.toml, exactly as
      # ci.yml's rust jobs are — a floating stable would make this ring's failures
      # ambiguous between "the app broke" and "the toolchain moved".
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Its own slot: this job builds a `tauri build` profile and additionally
          # caches the `tauri-driver` binary in ~/.cargo/bin, so sharing a key with
          # rust-checks would make the two evict each other every run.
          key: ring2
      # Same Tauri system libraries + apt-archive cache as ci.yml's rust jobs, PLUS the
      # two this ring adds: `webkit2gtk-driver` ships the WebKitWebDriver binary
      # tauri-driver drives, and `xvfb` gives the app a display on a headless runner.
      - name: Cache Tauri apt archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/nightcore-apt/tauri
          key: apt-tauri-${{ runner.os }}-v1
          restore-keys: apt-tauri-${{ runner.os }}-
      - name: Install Tauri + WebDriver system dependencies
        run: |
          store="$HOME/.cache/nightcore-apt/tauri"
          mkdir -p "$store"
          if compgen -G "$store/*.deb" >/dev/null; then
            sudo cp -n "$store"/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb
          cp -u /var/cache/apt/archives/*.deb "$store"/ 2>/dev/null || true
      - run: bun install --frozen-lockfile
      # tauri-driver is not in taiki-e/install-action's registry, so it compiles here —
      # ~1 min cold, then restored from the rust-cache bin slot above. Pinned to the v2
      # line (`^2`) rather than floating latest: a v3 with a changed capability shape
      # would break this ring for a reason unrelated to the app. `--locked` uses the
      # crate's own lockfile so the build is reproducible.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version "^2" --locked
      # Builds the web bundle + the sidecar externalBin (via `beforeBuildCommand`) and
      # then the Rust binary. `--debug` because this ring needs a WORKING binary, not a
      # fast one, and a debug build compiles far quicker. `--no-bundle` skips deb/rpm/
      # AppImage packaging entirely: it is minutes of work this ring does not use, and
      # AppImage tooling fetches from the network mid-build — a flake source with no
      # upside here. The Tauri CLI runs cargo with the crate dir as its cwd, so the
      # `.cargo/config.toml` the ts-rs export tests depend on is honored (#422).
      - name: Build the desktop app (debug, unbundled)
        run: bunx tauri build --debug --no-bundle
        working-directory: apps/desktop
      # The ring itself. `xvfb-run -a` gives WebKitGTK a display; everything else
      # (throwaway XDG dirs, the seeded board, the replay provider) is set up by the
      # script so it behaves identically for a human running it on a Linux box.
      #
      # The script's SELF-TEST runs by default: after the battery passes it destroys the
      # live app's DOM and then its IPC bridge and REQUIRES every corresponding check to
      # fail. A check that survives its own perturbation reds the job. That is what
      # keeps this from becoming the fifth vacuous check in this repo (#422).
      - name: Run ring 2
        run: xvfb-run -a bun run e2e:ring2
