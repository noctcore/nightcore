name: CI

# The correctness gate the contributor docs promise. Runs on every push to main
# and every PR so the guardrails stated as fact in docs/architecture.md and
# packages/contracts/AGENTS.md are enforced, not aspirational:
#   - `bun run lint` runs lint:meta, whose codegen-drift rule is
#     `gen-rust-contracts.ts --check` (the zod→Rust drift guard) plus
#     agent-contract-parity — this is the "tools/lint-meta fails CI" gate.
#   - the Rust job re-runs the ts-rs codegen via `cargo test` and asserts no
#     `git diff` — this is the "CI asserts no git diff" guard. Its last step
#     (`verify:drift-guard`) proves that assertion still TRIPS on a real
#     `#[derive(TS)]` change, because it silently became a no-op once (#422).
#   - every tier carries a coverage floor that FAILS the build below threshold:
#     node (`test:node:coverage`), web (vitest istanbul thresholds), and the Rust
#     core (`rust-coverage` job → `cargo llvm-cov`, issue #407).
# Dependency CVE scanning lives separately in audit.yml; this is the build/test
# correctness gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR push cancels the previous in-flight run for that ref (a
# frozen web-coverage step used to sit for 35+ minutes until someone noticed).
# Pushes to main keep per-commit runs: the group key includes the run id there,
# so nothing shares a group and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # macOS-only lane for the OS write-containment proof. The enforcement tests in
  # packages/engine/src/providers/claude/native-sandbox.test.ts are
  # `test.skipIf(!canSandbox)` — they need darwin + /usr/bin/sandbox-exec, so on
  # the ubuntu lanes above/below they always skip and the semantic guarantee of
  # this security feature is verified NOWHERE. This job runs the engine suite on a
  # real macOS runner so those tests (and `nativeSandboxAvailability().available`)
  # actually execute on every push.
  #
  # What they assert (T16 / #157): the `filesystem.allowWrite` set Nightcore hands
  # the SDK's native sandbox is compiled into the equivalent Seatbelt profile and a
  # real Bash redirect OUTSIDE it must be refused — so a regression that widens the
  # roots (e.g. lets $HOME back in) fails here rather than shipping a containment
  # claim nothing enforces. Deliberately NOT path-filtered: the policy this proves
  # is derived from code across the engine, and a skipped containment proof is
  # indistinguishable from a passing one. Scoped to `packages/engine` to keep macOS
  # minutes (billed at a premium) small.
  #
  # Its sibling `.github/workflows/macos-confine.yml` covers the OTHER, separate
  # Seatbelt writer — `apps/desktop/src-tauri/src/terminal/confine.rs`, the
  # confined-TERMINAL profile — which T12 §1b deliberately KEEPS. T16 did not move
  # or delete any file under `src/terminal/`, so that workflow's path filter still
  # covers exactly what it did before.
  macos-sandbox:
    name: seatbelt containment (macOS engine tests)
    runs-on: macos-latest
    # Normal run is ~1 min; macOS minutes bill at 10× so a wedged run is the
    # most expensive way to find out something hung.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The `@nightcore/*` workspace deps resolve through their package.json
      # `exports` (`./dist/index.js`), so a fresh checkout must BUILD the dep
      # chain before `bun test` can import them — otherwise bun reports
      # `Cannot find module '@nightcore/contracts'` and the whole suite errors
      # out (same reason apps/sidecar/scripts/compile.ts runs `tsc -b` first).
      # Scoped to `packages/engine`'s project references (contracts, storage,
      # shared) to keep premium macOS minutes small.
      - run: bunx tsc -b packages/engine
      - run: bun test packages/engine

  bun-checks:
    name: lint · typecheck · test (Bun workspace)
    runs-on: ubuntu-latest
    # ~1 min green. The web tier (the longest single step in CI) runs in the
    # parallel web-coverage job below so lint/type/test feedback isn't
    # serialized behind a 3-minute browser suite.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # --frozen-lockfile doubles as a lockfile-drift guard: it fails if bun.lock
      # is out of sync with the manifests.
      - run: bun install --frozen-lockfile
      # `bun run lint` = eslint-plugin build + `eslint .` + `lint:meta`. lint:meta
      # runs the codegen-drift rule (`gen-rust-contracts.ts --check`, the zod→Rust
      # guard) and agent-contract-parity. This is the "lint-meta fails CI" gate.
      - run: bun run lint
      - run: bun run typecheck
      # The node + plugin JS/TS tiers. The web tier runs in web-coverage; the
      # Rust tier in rust-checks. The node tier runs under a coverage floor so
      # a new module can't ship untested (tools/coverage/check-node-coverage.ts).
      # Plugin runs on vitest.
      - run: bun run test:node:coverage
      - run: bun run test:plugin
      # E2E ladder RING 3 (issue #406): spawn the REAL sidecar child, speak its REAL
      # NDJSON stdio protocol, and replay a checked-in transcript through the provider
      # seam instead of a live model. This is the offline half of `dogfood:engine` —
      # no credential, no network, no spend — and the only tier that exercises the
      # sidecar process boundary (ring 1 is in-process; the Rust tier has no child).
      #
      # It lives INSIDE this already-required job rather than in a job of its own
      # because it costs ~2 seconds: a separate job would spend a minute on checkout +
      # install to run a two-second check, and would need branch protection updated to
      # become required. Riding here makes it blocking from day one at ~0 cost. It
      # needs the workspace dists, which `bun run typecheck` (a root `tsc -b`) built
      # above.
      #
      # `--prove` is the anti-vacuity guard: it perturbs the fixture two ways and
      # REQUIRES the battery to trip on both, so this step cannot silently become a
      # check that passes with the pipeline broken (cf. `verify:drift-guard` in the
      # Rust job, and #422).
      - run: bun run e2e:ring3 --prove

  web-coverage:
    name: vitest browser coverage (apps/web)
    runs-on: ubuntu-latest
    # ~3 min green (browser suite + coverage floor via Vitest istanbul
    # thresholds, apps/web/vitest.config.ts).
    timeout-minutes: 10
    steps:
      # ubuntu-24.04 runners advertise ~14GB free but real headroom varies VM
      # to VM: run 28756795439 ENOSPC'd 70% through this suite while the rerun
      # on an identical image version passed. The suite itself writes <100MB
      # (measured locally) — the margin is eaten by the preinstalled toolchains,
      # so drop the two big unused ones (~7GB; the Android SDK is bigger still but
      # takes a minute to rm, not worth it).
      #
      # The rm itself costs ~14s on the critical path, so gate it: reclaim ONLY when
      # free space is below a comfortable floor (~12 GiB — well above this job's few-GB
      # peak). A VM that already has ample space skips the rm (the common case, per
      # the "~14GB advertised" baseline); a tight VM (the F4 class) still reclaims, so
      # the ENOSPC guard is preserved, not weakened. df lines bracket the reclaim so a
      # future ENOSPC stays diagnosable from this log.
      - name: Free runner disk space (only when low)
        run: |
          avail=$(df -Pk / | awk 'NR==2 {print $4}')
          threshold=12582912  # 12 GiB in 1K-blocks
          if [ "$avail" -lt "$threshold" ]; then
            echo "Low disk: ${avail}K free (< ${threshold}K) — reclaiming dotnet/CodeQL"
            df -h /
            sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
            df -h /
          else
            echo "Ample disk: ${avail}K free (>= ${threshold}K) — skipping reclaim"
          fi
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # apps/web resolves @nightcore/contracts + session-fold through their
      # package.json exports (./dist/index.js), so a fresh checkout must build
      # the dep chain before vite can serve the tests — the same reason the
      # macOS job runs `tsc -b packages/engine`. (bun-checks gets this for free
      # from `bun run typecheck`, which is a root `tsc -b`.)
      - run: bunx tsc -b apps/web
      # Vitest browser mode drives Playwright's own chromium build, which
      # runners don't ship. The ~100MB browser download is cached keyed on
      # bun.lock; on an exact hit only the distro shared libraries are
      # (re)installed (playwright install-deps), which is the cheap half of
      # `playwright install --with-deps`.
      - name: Cache Playwright chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      # Run from apps/web so the isolated workspace layout resolves the
      # playwright package (it is apps/web's dep, not the root's).
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      # Cache the .deb archives Playwright's `install-deps` pulls (chromium fonts +
      # any system libs the base image doesn't already ship). A warm run installs
      # them from the runner-local cache instead of re-fetching from the periodically
      # slow Azure apt mirror — the F1 flake spiked this step from 14s to 315-330s
      # (docs/research/2026-07-11-ci-performance.md). `install-deps` stays the source
      # of truth for WHICH packages are needed (no hand-maintained list), so the exact
      # same system deps are installed — only their download is cached. Static key +
      # a manual version token (bump `-v1` to force a cold refetch); prefix restore-key
      # seeds a token bump. Worst case (empty/failed cache) degrades to today's
      # behavior — it never reds the gate.
      - name: Cache Playwright apt archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/nightcore-apt/playwright
          key: apt-playwright-${{ runner.os }}-v1
          restore-keys: apt-playwright-${{ runner.os }}-
      # QW2 (docs/research/2026-07-11-ci-performance.md): on a browser cache-hit
      # this ~14s step used to install system deps unconditionally, and
      # `install-deps` runs its own `apt-get update` which re-contacts the Azure
      # mirror every run (the apt-archive cache above only caches downloaded .debs,
      # not the index refresh). ubuntu-latest already ships most of chromium's
      # shared libraries; when it ships all of them this install is pure apt
      # overhead. Probe the cached chromium binaries with ldd and skip the install
      # only when nothing is missing. Self-verifying and fail-safe: no binary found
      # OR any `=> not found` falls through to install-deps, so the browser suite
      # never runs against a chromium with unmet shared libs. (A dlopen'd/font dep
      # not visible to ldd is the residual risk — the PR's own CI run validates it.)
      - name: Install Playwright system deps (only when chromium libs missing)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          found=0
          missing=0
          while IFS= read -r bin; do
            found=1
            if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
              missing=1
            fi
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name headless_shell \) -path '*chrome-linux*' 2>/dev/null)
          if [ "$found" = 1 ] && [ "$missing" = 0 ]; then
            echo "chromium shared libs already satisfied on this runner — skipping install-deps (QW2)"
            exit 0
          fi
          echo "chromium missing shared libs (or binary not found) — installing system deps"
          store="$HOME/.cache/nightcore-apt/playwright"
          mkdir -p "$store"
          # Seed apt's archive dir with cached .debs so install-deps finds them already
          # downloaded and skips the mirror fetch (QW1). -n never clobbers a newer archive.
          if compgen -G "$store/*.deb" >/dev/null; then
            sudo cp -n "$store"/*.deb /var/cache/apt/archives/ || true
          fi
          bunx playwright install-deps chromium
          # Persist whatever apt resolved for the next run's cache.
          cp -u /var/cache/apt/archives/*.deb "$store"/ 2>/dev/null || true
        working-directory: apps/web
      # Vite dep-optimize + vitest processed-module cache. A warm cache shaves
      # vitest startup and shrinks the mid-run dep-discovery window (the
      # silent-freeze mode documented on the coverage step). Restored after
      # bun install so the install can't clobber it; vite revalidates the
      # bundle hashes itself, so a stale restore just re-optimizes at startup.
      - name: Cache Vite/Vitest cache dir
        uses: actions/cache@v6
        with:
          path: apps/web/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: vite-${{ runner.os }}-
      # Step-scoped timeout because this is the step with a known silent-freeze
      # mode: if Vite's dep optimizer discovers a dependency mid-run in a
      # browser project, the "optimized dependencies changed" reload kills the
      # in-flight test page and the vitest server waits on that file forever
      # with zero output. `react-dom/client` is pre-bundled against exactly
      # that (vitest.config.ts + .storybook/main.ts); the timeout turns any
      # residual hang (e.g. a newly-added dep — the vitest warning names the
      # culprit verbatim in the step log) into a fast red instead of a
      # job-timeout burn.
      - run: bun run test:web:coverage
        timeout-minutes: 7

  rust-checks:
    name: cargo test · clippy · fmt · ts-rs drift (Rust core)
    runs-on: ubuntu-latest
    # ~4 min with a warm cargo cache, but a cold cache (toolchain bump,
    # lockfile change, cache eviction) rebuilds the whole Tauri dep tree —
    # the ceiling is sized for that, not the warm path. If a legitimate cold
    # build ever trips this, bump it once rather than removing it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Toolchain pinned to match apps/desktop/src-tauri/rust-toolchain.toml so
      # clippy -D warnings runs against a known release, not a floating stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Tauri v2 needs the WebKitGTK / GTK system libraries to compile on Linux.
      # --no-install-recommends skips the icon-theme/doc payload the GTK stack
      # recommends (~half the 55s install); the -dev packages hard-Depend on
      # everything the build actually links. If a future toolchain bump fails
      # with a missing-library error here, drop the flag before digging deeper.
      # Cache the resolved .deb archives so a warm run installs them from the
      # runner-local cache instead of re-fetching the big GTK/WebKit -dev packages
      # from the periodically slow Azure apt mirror — the F2 flake spiked this step
      # from 27s to 350-439s (docs/research/2026-07-11-ci-performance.md). The exact
      # same packages are installed (list + --no-install-recommends unchanged) — only
      # their download is cached. Static key + a manual version token (bump `-v1` to
      # force a cold refetch); prefix restore-key seeds a token bump. Worst case
      # (empty/failed cache) degrades to today's behavior — it never reds the gate.
      - name: Cache Tauri apt archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/nightcore-apt/tauri
          key: apt-tauri-${{ runner.os }}-v1
          restore-keys: apt-tauri-${{ runner.os }}-
      - name: Install Tauri system dependencies
        run: |
          store="$HOME/.cache/nightcore-apt/tauri"
          mkdir -p "$store"
          # Seed apt's archive dir with cached .debs so `apt-get install` finds them
          # already downloaded and skips the mirror fetch. -n never clobbers a newer
          # archive the base image may already ship.
          if compgen -G "$store/*.deb" >/dev/null; then
            sudo cp -n "$store"/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          # Persist whatever apt resolved for the next run's cache.
          cp -u /var/cache/apt/archives/*.deb "$store"/ 2>/dev/null || true
      - run: bun install --frozen-lockfile
      # Style half of the Rust lint gate: rustfmt.toml pins the style, so a
      # formatting diff is a CI failure, not editor noise. Runs before the
      # compile steps because it needs no build artifacts.
      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      # `bun run test:rust` compiles the sidecar (Tauri externalBin) then runs
      # `cargo test`, which also re-exports the Rust structs into
      # apps/web/src/lib/generated/ via ts-rs.
      #
      # E2E ladder RING 3(b) (issue #253) rides this step: `src/e2e/sidecar_boundary/`
      # boots that just-compiled sidecar against a scratch git repo in a temp dir and
      # drives it with the REAL Rust `SidecarProvider` — the CORE half of the live
      # sidecar↔core boundary that ring 3 (`e2e:ring3`, driven from TypeScript) cannot
      # see. It rides here rather than in a job of its own for the same reason ring 3
      # rides `bun-checks`: it costs ~1 second, its two prerequisites (the compiled
      # externalBin + a warm cargo cache) are already paid for by this step, and a
      # separate job would need branch protection updated to become required. The
      # compile is `test:rust`'s own first half, so the binary is always present — the
      # ring has no skip path.
      #
      # Its timeout is IN the test (a 30s per-wait ceiling, plus the provider's own 20s
      # query timeout): a wedged child reds in seconds instead of burning this job's
      # 30-minute budget.
      - run: bun run test:rust
      # Static-analysis half of the Rust lint gate — the TS side's error-or-off
      # discipline applied to Rust. Runs AFTER test:rust so the sidecar
      # externalBin exists (the Tauri build script requires it) and the cargo
      # cache is warm. Lives here, NOT in lint-meta: the Bun lint job has no
      # Tauri system deps and would red the gate.
      # Two opt-in ratchets on top of -D warnings (audit #38): a MutexGuard held
      # across an .await (deadlocks the pool) and production unwraps (a panic in a
      # handler aborts across the WKWebView extern-"C" boundary). Tests may unwrap
      # (clippy.toml: allow-unwrap-in-tests).
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings -W clippy::await_holding_lock -W clippy::unwrap_used
        working-directory: apps/desktop/src-tauri
      # ts-rs regenerate-and-diff guard. cargo test rewrote the bindings above; if
      # they differ from what is committed, a Rust struct changed without the
      # generated TS being regenerated. This makes the "CI asserts no git diff"
      # claim in docs/architecture.md real.
      - name: Assert ts-rs bindings are in sync
        run: git diff --exit-code -- apps/web/src/lib/generated
      # …and prove that guard is not a no-op. It passed VACUOUSLY from both local
      # entry points for its whole life (#422): cargo reads .cargo/config.toml by
      # walking up from the CWD, not from --manifest-path, so a root-cwd run left
      # TS_RS_EXPORT_DIR unset and ts-rs wrote to the gitignored crate-default
      # bindings/ — the diff above was clean because NOTHING was written to the
      # directory it guards. This step perturbs a `#[derive(TS)]` type, re-runs the
      # export, asserts the diff FAILS, and restores both. Runs last: it needs the
      # warm cargo cache and the compiled sidecar externalBin from the steps above.
      - name: Prove the ts-rs drift guard trips on a real change
        run: bun run verify:drift-guard

  rust-coverage:
    name: cargo llvm-cov coverage floor (Rust core)
    runs-on: ubuntu-latest
    # Its own job rather than a step in rust-checks: `-C instrument-coverage`
    # rebuilds the entire Tauri dependency tree, so it shares no artifacts with
    # that job and would otherwise double its critical path instead of running in
    # parallel (the same reason web-coverage is split out). Sized for a cold
    # instrumented build of the whole tree, not the warm path.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Pinned to match apps/desktop/src-tauri/rust-toolchain.toml (same as
      # rust-checks); llvm-tools-preview ships the llvm-profdata/llvm-cov binaries
      # cargo-llvm-cov drives.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Own cache slot: instrumented artifacts are incompatible with
          # rust-checks', so a shared key would make the two jobs evict each
          # other's tree on every run.
          key: llvm-cov
      # Prebuilt cargo-llvm-cov binary (same mechanism audit.yml uses for
      # cargo-audit) — `cargo install` would spend minutes compiling it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Same Tauri system libraries + apt-archive cache as rust-checks; the crate
      # links WebKitGTK/GTK on Linux whether or not it is instrumented.
      - name: Cache Tauri apt archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/nightcore-apt/tauri
          key: apt-tauri-${{ runner.os }}-v1
          restore-keys: apt-tauri-${{ runner.os }}-
      - name: Install Tauri system dependencies
        run: |
          store="$HOME/.cache/nightcore-apt/tauri"
          mkdir -p "$store"
          if compgen -G "$store/*.deb" >/dev/null; then
            sudo cp -n "$store"/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          cp -u /var/cache/apt/archives/*.deb "$store"/ 2>/dev/null || true
      - run: bun install --frozen-lockfile
      # The tauri build script requires the sidecar externalBin to exist before the
      # crate compiles — same prerequisite macos-confine.yml has.
      - run: bun run --filter @nightcore/sidecar compile
      # Runs the same suite `cargo test` runs, under source-based instrumentation,
      # and fails below the floor in tools/coverage/check-rust-coverage.ts (the
      # Rust sibling of the node tier's check-node-coverage.ts). The floor is a
      # ratchet: raise it as coverage grows, never lower it.
      - run: bun run test:rust:coverage
